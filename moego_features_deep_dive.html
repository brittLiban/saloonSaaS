let activeCard = null;

function build() {
  const container = document.getElementById('sections-container');
  sections.forEach((section, si) => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    secDiv.innerHTML = `<div class="section-header">${section.title}</div>`;
    const grid = document.createElement('div');
    grid.className = 'feature-grid';
    section.features.forEach((feat, fi) => {
      const card = document.createElement('div');
      card.className = 'feature-card';
      card.id = `card-${si}-${fi}`;
      card.innerHTML = `
        <div class="card-icon"><i class="ti ${feat.icon}" aria-hidden="true"></i></div>
        <div class="card-title">${feat.title}</div>
        <div class="card-desc">${feat.desc}</div>
      `;
      card.addEventListener('click', () => toggleDetail(feat, card));
      grid.appendChild(card);
    });
    secDiv.appendChild(grid);
    container.appendChild(secDiv);
  });
}

function toggleDetail(feat, card) {
  const panel = document.getElementById('detail-panel');
  if (activeCard === card) {
    panel.classList.remove('visible');
    card.classList.remove('active');
    activeCard = null;
    return;
  }
  if (activeCard) activeCard.classList.remove('active');
  activeCard = card;
  card.classList.add('active');

  const d = feat.detail;
  const itemsHtml = d.items.map(item => `
    <div class="detail-item">
      <div class="detail-item-icon"><i class="ti ${item.icon}" aria-hidden="true"></i></div>
      <div class="detail-item-content">
        <div class="detail-item-label">${item.label}</div>
        <div class="detail-item-text">${item.text}</div>
      </div>
    </div>
  `).join('');
  const tagsHtml = d.tags.map(t => `<span class="tag tag-${t.color}">${t.label}</span>`).join('');
  panel.innerHTML = `
    <button class="close-btn" onclick="closePanel()">close ×</button>
    <div class="detail-title">${d.title}</div>
    ${itemsHtml}
    ${tagsHtml}
    <div class="uxNote" style="background:#E6F1FB;border-left:3px solid #378ADD;border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;color:#185FA5;margin-top:1rem;line-height:1.6;">
      <strong>Build note:</strong> ${d.uxNote}
    </div>
  `;
  panel.classList.add('visible');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closePanel() {
  const panel = document.getElementById('detail-panel');
  panel.classList.remove('visible');
  if (activeCard) { activeCard.classList.remove('active'); activeCard = null; }
}

build();
</script>
