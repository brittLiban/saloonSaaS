services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glasshound}
      POSTGRES_USER: ${POSTGRES_USER:-glasshound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glasshound_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glasshound} -d ${POSTGRES_DB:-glasshound}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-glasshound}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-glasshound_dev_password}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-glasshound} ${MINIO_ROOT_PASSWORD:-glasshound_dev_password};
      mc mb -p local/${S3_BUCKET:-glasshound-assets};
      mc anonymous set none local/${S3_BUCKET:-glasshound-assets};
      exit 0;
      "

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-glasshound}:${POSTGRES_PASSWORD:-glasshound_dev_password}@postgres:5432/${POSTGRES_DB:-glasshound}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-glasshound-assets}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-glasshound}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-glasshound_dev_password}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-in-production}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q healthy"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-glasshound}:${POSTGRES_PASSWORD:-glasshound_dev_password}@postgres:5432/${POSTGRES_DB:-glasshound}?schema=public
      REDIS_URL: redis://redis:6379

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
